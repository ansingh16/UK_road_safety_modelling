strategy: severe-optimized
description: >
  Emergency response configuration — maximises recall for severe accidents (class 1)
  at the cost of higher false-alarm rate. Use when missing a critical case is
  unacceptable (ambulance dispatch, trauma team pre-alert).

data:
  years: [2023]
  test_size: 0.2

sampling:
  method: SMOTE+Tomek
  random_state: 42

models:
  RF_SevereOptim:
    type: RandomForestClassifier
    params:
      n_estimators: 100
      max_depth: 10
      class_weight: {1: 50, 2: 5, 3: 1}
      random_state: 42

  LR_SevereOptim:
    type: LogisticRegression
    params:
      class_weight: {1: 50, 2: 5, 3: 1}
      max_iter: 1000
      random_state: 42

  GB_SevereOptim:
    type: GradientBoostingClassifier
    params:
      n_estimators: 100
      max_depth: 6
      random_state: 42

  LightGBM_SevereOptim:
    type: LGBMClassifier
    params:
      objective: multiclass
      num_class: 3
      class_weight: {1: 50, 2: 5, 3: 1}
      n_estimators: 100
      random_state: 42
      verbosity: -1

threshold:
  target_recall: 0.95
  optimise: true
